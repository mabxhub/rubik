<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=contain">
<meta name="theme-color" content="#d4d7d9">
<meta name="description" content="Penyelesai Rubik 3D langkah demi langkah.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Penyelesai Rubik 3D</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tutorial.css">
<script defer src="vendor/three.min.js"></script>
<script defer src="engine.js"></script>
<script defer src="app.js"></script>
<script defer src="tutorial-moves.js"></script>
<script defer src="tutorial.js"></script>
<script defer src="pwa.js"></script>
</head>
<body>
<header>
<div id="paletteBar" aria-label="Pilihan warna"></div>
<div class="utility"><button id="btnView" type="button" aria-label="Sudut asal" title="Sudut asal">↺</button><button id="btnTutorial" type="button" aria-label="Buka tutorial penyelesaian Rubik" title="Tutorial Rubik">?</button><button id="btnInstall" class="hidden" type="button">Pasang</button></div>

</header>
<main id="canvasWrap"><canvas id="rubikCanvas" aria-label="Seret kiub untuk putar. Ketik petak untuk warna."></canvas></main>
<div id="statusBanner" class="hidden status" role="alert"><span id="statusText"></span><button id="btnDismissStatus" type="button" aria-label="Tutup mesej">×</button></div>
<div id="pwaNotice" class="hidden status" role="status"><span>Versi baharu tersedia.</span><button id="btnUpdate" type="button">Kemas kini</button></div>
<footer>
<div id="paintControls"><select id="solveMethod" aria-label="Pilih teknik penyelesaian"><option value="auto">Automatik · Empat fasa</option><option value="beginner">Beginner · Layer by Layer</option><option value="cfop2">CFOP mudah · 2-Look OLL / PLL</option><option value="cfop">CFOP penuh · OLL / PLL</option><option value="zz">ZZ · EOLine / F2L / OCLL / PLL</option></select><div id="paintBottomBar"><button id="btnReset" type="button">Reset</button><div class="actions"><button id="btnScramble" type="button" aria-label="Acak kiub" title="Acak kiub">⤨</button><button id="btnSolve" type="button">Selesaikan</button></div></div></div>
<div id="solvePlayerBar" class="hidden player"><div class="stage-heading"><strong id="solutionStageTitle"></strong><span id="solutionStageCount"></span></div><div id="solutionFormula" aria-label="Formula semasa"></div><div class="move-row"><div id="moveBadge">—</div><div class="instruction"><div id="stepCounterText"></div><div id="moveInstructionText"></div></div><button id="btnExitSolve" type="button" aria-label="Kembali mewarna">✎</button></div><div class="playback-options"><select id="autoSpeed" aria-label="Tempoh setiap pusingan kiub"><option value="500">0.5 s</option><option value="1000" selected>1 s</option><option value="1500">1.5 s</option><option value="2000">2 s</option></select><button id="btnArrows" type="button" aria-label="Tunjuk anak panah pusingan" aria-pressed="true">↻</button></div><div class="player-buttons"><button id="btnPrevStep" type="button" aria-label="Langkah sebelumnya">◀</button><button id="btnAutoPlay" type="button"><span id="autoPlayIcon">▶</span> <span id="autoPlayLabel">Auto</span></button><button id="btnNextStep" type="button" aria-label="Langkah seterusnya">▶</button></div></div>
</footer>
<dialog id="tutorialDialog" class="tutorial-dialog" aria-labelledby="tutorialTitle"><div class="tutorial-toolbar"><button id="tutorialBack" type="button" aria-label="Kembali ke tutorial sebelumnya" class="hidden">‹</button><h2 id="tutorialTitle">Tutorial Rubik</h2><button id="tutorialClose" type="button" aria-label="Tutup tutorial">×</button></div><div id="tutorialContent"></div><div id="tutorialNav" class="tutorial-nav"></div></dialog>
<noscript>JavaScript diperlukan.</noscript>
</body>
</html>
