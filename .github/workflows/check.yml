name: Check Rubik solver
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check engine.js && node --check solver-worker.js
      - run: node tests/engine.test.cjs && node tests/painting.test.cjs
